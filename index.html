<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="description" content="Hardwood Legacy - a roguelike basketball career game. One run = one career.">
<title>Hardwood Legacy</title>
<script src="src/migrate.js"></script>
<style>
  @font-face {
    font-family: 'Press Start 2P';
    src: url('assets/fonts/PressStart2P-Regular.ttf') format('truetype');
    font-display: block;
  }
  :root { --bg: #1e3a8a; --dark: #142a63; --white: #ffffff; --orange: #f97316; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; font-family: 'Press Start 2P', monospace; color: var(--white); }
  body { display: flex; flex-direction: column; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  #screen { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; min-width: 0; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: var(--bg); }
  #pad { display: none; position: relative; height: 200px; flex: none; padding-bottom: env(safe-area-inset-bottom); }
  .btn { position: absolute; background: var(--bg); border: 2px solid var(--white); color: var(--white);
    display: flex; align-items: center; justify-content: center; font-size: 11px; touch-action: none; }
  .btn.on { background: var(--orange); }
  .dpad { position: absolute; left: 14px; top: 16px; width: 150px; height: 150px; }
  .dpad .btn { width: 50px; height: 50px; }
  .dpad [data-btn=up] { left: 50px; top: 0; } .dpad [data-btn=down] { left: 50px; top: 100px; }
  .dpad [data-btn=left] { left: 0; top: 50px; } .dpad [data-btn=right] { left: 100px; top: 50px; }
  .ab { position: absolute; right: 14px; top: 22px; width: 160px; height: 140px; }
  .ab .round { border-radius: 50%; width: 70px; height: 70px; font-size: 10px; }
  .ab [data-btn=a] { right: 0; top: 0; border-color: var(--orange); }
  .ab [data-btn=b] { left: 0; top: 50px; }
  .meta { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; display: flex; gap: 6px; }
  .meta .btn { position: static; padding: 6px 6px; font-size: 7px; white-space: nowrap; }
  #version { position: fixed; left: 8px; bottom: 6px; font-size: 7px; color: var(--white); opacity: 0.6; z-index: 1; pointer-events: none; }
  @media (pointer: coarse) { #version { top: calc(6px + env(safe-area-inset-top)); bottom: auto; } }
  /* Desktop-Leiste unter dem Spiel */
  #bar { flex: none; display: flex; justify-content: center; gap: 10px; padding: 0 12px 18px; }
  .bbtn { font: 8px 'Press Start 2P', monospace; color: var(--white); background: var(--bg); border: 2px solid var(--white);
    padding: 7px 9px; cursor: pointer; box-shadow: 2px 2px 0 var(--dark); }
  .bbtn:hover, .bbtn.on { background: var(--orange); }
  /* Kaffee-/Trinkgeld-Button */
  .tip { border-color: var(--orange) !important; display: inline-flex; align-items: center; gap: 6px; }
  .tip[hidden] { display: none !important; }
  .cup { width: 14px; height: 12px; shape-rendering: crispEdges; flex: none; }
  .meta .tip { padding: 4px 7px; }
  .tip-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  .tip-grid a, .tip-any { display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
  .tip-any { margin-top: 8px; }
  @media (pointer: coarse) { #bar { display: none; } }
  /* How-to-Play-Popup */
  #help { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.45); padding: 16px; touch-action: auto; }
  .help-win { width: min(440px, 100%); max-height: min(520px, 82dvh); display: flex; flex-direction: column;
    background: var(--bg); border: 4px double var(--white); box-shadow: 4px 4px 0 var(--dark); }
  .help-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 8px 14px;
    background: var(--dark); color: var(--orange); font-size: 11px; }
  .help-x { font: 11px 'Press Start 2P', monospace; color: var(--white); background: var(--bg); border: 2px solid var(--white);
    width: 30px; height: 30px; cursor: pointer; padding: 0; }
  .help-x:hover { background: var(--orange); }
  .help-body { overflow-y: auto; padding: 4px 16px 12px; font-size: 8px; line-height: 1.8; touch-action: pan-y;
    -webkit-user-select: text; user-select: text; scrollbar-color: var(--orange) var(--dark); }
  .help-body h3 { color: var(--orange); font-size: 10px; font-weight: normal; margin: 16px 0 8px; }
  .help-body p { margin: 0; }
  .seed-in { display: block; width: 100%; margin: 12px 0; padding: 10px; font: 14px 'Press Start 2P', monospace; text-transform: uppercase;
    color: var(--orange); background: var(--dark); border: 2px solid var(--white); outline: none; -webkit-user-select: text; user-select: text; }
  .seed-go { width: 100%; }
  .share-card { text-align: center; margin-top: 12px; }
  .share-card img { width: 100%; max-width: 320px; image-rendering: pixelated; border: 2px solid var(--white); }
  .share-text { font-size: 7px; margin: 8px 0 !important; opacity: 0.85; }
  .share-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .share-btn { font: 8px 'Press Start 2P', monospace; color: var(--white); background: var(--bg); border: 2px solid var(--white);
    padding: 9px 4px; cursor: pointer; box-shadow: 2px 2px 0 var(--dark); }
  .share-btn:hover { background: var(--orange); }
  .share-note { color: var(--orange); margin-top: 8px !important; min-height: 10px; }
  .help-body .u-type { color: var(--orange); font-size: 7px; margin-bottom: 4px; }
  .help-body .u-count { margin-top: 12px; }
  .help-body .u-locked h3, .help-body .u-locked p { opacity: 0.5; }
  .help-body:focus { outline: none; }
  .help-foot { padding: 8px 12px; font-size: 7px; text-align: center; border-top: 2px solid var(--white); }
  /* Schmale Handys: Pad kompakter */
  @media (max-width: 380px) {
    .dpad { left: 8px; width: 126px; height: 126px; }
    .dpad .btn { width: 42px; height: 42px; }
    .dpad [data-btn=up] { left: 42px; } .dpad [data-btn=down] { left: 42px; top: 84px; }
    .dpad [data-btn=left] { top: 42px; } .dpad [data-btn=right] { left: 84px; top: 42px; }
    .ab { right: 8px; width: 124px; }
    .ab .round { width: 58px; height: 58px; }
  }
  /* Touch-Geraete: Pad anzeigen */
  @media (pointer: coarse) { #pad { display: block; } }
  /* Touch + Querformat: Pad links/rechts neben dem Screen */
  @media (pointer: coarse) and (orientation: landscape) {
    body { flex-direction: row; }
    #pad { position: absolute; inset: 0; height: auto; pointer-events: none; }
    #pad .btn { pointer-events: auto; }
    .dpad { left: 12px; top: 50%; transform: translateY(-50%); }
    .ab { right: 12px; top: 50%; transform: translateY(-50%); width: 120px; height: 160px; }
    .ab [data-btn=a] { right: 0; top: 0; } .ab [data-btn=b] { left: 0; top: 80px; }
    .meta { left: 12px; bottom: 8px; transform: none; flex-direction: column; }
    #screen { padding: 0 170px; }
  }
</style>
</head>
<body>
  <div id="version"></div>
  <div id="screen"><canvas id="game" width="160" height="144"></canvas></div>
  <div id="bar">
    <button class="bbtn" data-btn="menu" data-label="menu">MENU</button>
    <button class="bbtn" data-btn="help" data-label="help">HELP</button>
    <button class="bbtn" data-btn="options" data-label="options">OPTIONS</button>
    <button class="bbtn" data-btn="stats" data-label="stats">STATS</button>
    <button class="bbtn" data-btn="mute" data-label="sound">SOUND</button>
    <button class="bbtn tip" id="tip-bar" hidden><svg class="cup" viewBox="0 0 9 8" aria-hidden="true"><path d="M2 0h1v1H2zM4 0h1v1H4zM6 0h1v1H6zM0 2h7v4H0zM7 3h2v2H7zM1 6h5v1H1zM0 7h7v1H0z" fill="currentColor"/></svg><span data-label="tip">COFFEE</span></button>
  </div>
  <div id="pad">
    <div class="dpad">
      <div class="btn" data-btn="up">&#9650;</div><div class="btn" data-btn="left">&#9664;</div>
      <div class="btn" data-btn="right">&#9654;</div><div class="btn" data-btn="down">&#9660;</div>
    </div>
    <div class="ab"><div class="btn round" data-btn="b">BACK</div><div class="btn round" data-btn="a">OK</div></div>
    <div class="meta"><div class="btn" data-btn="menu" data-label="menuT">MENU</div><div class="btn" data-btn="help" data-label="helpT">HELP</div><div class="btn" data-btn="options" data-label="optionsT">OPTIONS</div><div class="btn" data-btn="stats" data-label="statsT">STATS</div><div class="btn" data-btn="mute" data-label="soundT">SOUND</div><div class="btn tip" id="tip-pad" hidden aria-label="Tip"><svg class="cup" viewBox="0 0 9 8" aria-hidden="true"><path d="M2 0h1v1H2zM4 0h1v1H4zM6 0h1v1H6zM0 2h7v4H0zM7 3h2v2H7zM1 6h5v1H1zM0 7h7v1H0z" fill="currentColor"/></svg></div></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
